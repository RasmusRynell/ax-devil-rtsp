[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ax-devil-rtsp"
dynamic = ["version"]
description = "Receive RTSP video and Axis scene metadata from Axis cameras"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rasmus Rynell", email = "Rynell.Rasmus@gmail.com"},
]
dependencies = [
    "av>=17",
    "numpy>=1.23",
    "click>=8.0.0",
]

[project.optional-dependencies]
display = [
    "opencv-python>=4.5.0",
]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/rasmusrynell/ax-devil-rtsp"
Repository = "https://github.com/rasmusrynell/ax-devil-rtsp.git"
Documentation = "https://github.com/rasmusrynell/ax-devil-rtsp#readme"
"Bug Tracker" = "https://github.com/rasmusrynell/ax-devil-rtsp/issues"

[project.scripts]
ax-devil-rtsp = "ax_devil_rtsp.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ax_devil_rtsp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ax_devil_rtsp*"]

[tool.setuptools.package-data]
ax_devil_rtsp = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.isort]
known-local-folder = ["fake_camera"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2"]
ignore_missing_imports = true