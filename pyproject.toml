[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ax-devil-rtsp"
dynamic = ["version"]
description = "Python library for RTSP streaming from Axis devices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rasmus Rynell", email = "Rynell.Rasmus@gmail.com"},
]
dependencies = [
    # Windows: GStreamer and PyGObject come from the official pip wheels.
    "gstreamer-meta>=1.28; sys_platform == 'win32'",
    "numpy>=1.20.0",
    "opencv-python>=4.5.0",
    "click>=8.0.0",
    "PyGObject==3.54.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/rasmusrynell/ax-devil-rtsp"
Repository = "https://github.com/rasmusrynell/ax-devil-rtsp.git"
Documentation = "https://github.com/rasmusrynell/ax-devil-rtsp#readme"
"Bug Tracker" = "https://github.com/rasmusrynell/ax-devil-rtsp/issues"

[project.scripts]
ax-devil-rtsp = "ax_devil_rtsp.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "requires_hardware: marks tests that require physical hardware",
    "requires_gstreamer: marks tests that need GStreamer installation",
]
filterwarnings = [
    "ignore:.*g_object_get_is_valid_property.*:UserWarning",
    "ignore:.*has no property named.*:UserWarning",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ax_devil_rtsp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ax_devil_rtsp*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I"]